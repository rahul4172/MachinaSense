version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - MODELS_DIR=/app/models
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/machinasense.db
    volumes:
      - ./backend/models:/app/models
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
